<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar tarefa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container narrow">
        <header>
            <h1>✏️ Editar tarefa</h1>
        </header>
        <section class="card">
            <form action="{{ url_for('editar', tarefa_id=tarefa['id']) }}" method="POST" class="form-nova">
                <label>Título</label>
                <input type="text" name="titulo" value="{{ tarefa['titulo'] }}" required maxlength="120">
                <label>Descrição</label>
                <input type="text" name="descricao" value="{{ tarefa['descricao'] or '' }}" maxlength="300">
                <div class="form-row">
                    <div>
                        <label>Tipo</label>
                        <select name="tipo">
                            <option value="atividade" {% if tarefa['tipo']=='atividade' %}selected{% endif %}>Atividade</option>
                            <option value="pendencia" {% if tarefa['tipo']=='pendencia' %}selected{% endif %}>Pendência</option>
                            <option value="objetivo" {% if tarefa['tipo']=='objetivo' %}selected{% endif %}>Objetivo</option>
                        </select>
                    </div>
                    <div>
                        <label>Prioridade</label>
                        <select name="prioridade">
                            <option value="baixa" {% if tarefa['prioridade']=='baixa' %}selected{% endif %}>Baixa</option>
                            <option value="media" {% if tarefa['prioridade']=='media' %}selected{% endif %}>Média</option>
                            <option value="alta" {% if tarefa['prioridade']=='alta' %}selected{% endif %}>Alta</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <button type="submit" class="btn primary">Salvar</button>
                    <a href="{{ url_for('index') }}" class="btn link">Cancelar</a>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
